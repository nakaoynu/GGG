# ================================================================
# 磁場・温度一括ベイズ推定プログラム用 設定ファイル (config_test.yml)
# unified_weighted_bayesian_fitting.py 専用
# ================================================================

# --- ファイルパス設定 ---
file_paths:
  # 複数データファイル対応
  # 各ファイルから温度列('K'で終わる)と磁場列('T'で終わる)を自動検出
  data_files:
    # 温度変化データファイル
    - file: "bayesian_inputs_undet150K/BayesianInput_Raw_Transmittance_Temperature.xlsx"
      sheet: "Normalized Data"
      type: "temperature"
      description: "温度変化データ (B=9.0T固定)"
    
    # 磁場変化データファイル
    - file: "bayesian_inputs_undet150K/BayesianInput_Raw_Transmittance_Field.xlsx"
      sheet: "Normalized Data"
      type: "field"
      description: "磁場変化データ (T=4K固定)"
  
  # 結果を出力する親ディレクトリ名
  results_parent_dir: "fullsize_analysis_results_unified"

# --- 実行環境設定（CPU並列化） ---
execution:
  # 1チェーンあたりのCPUスレッド数（行列演算の並列化）
  # 
  # ベクトル化計算により、NumPyブロードキャストがMKL/OpenBLASを活用
  # 
  # c7i.8xlarge (32 vCPU) の推奨設定:
  #   - chains=8, threads_per_chain=4 → 32 vCPU使用
  threads_per_chain: 8

# --- 物理パラメータ・初期値 ---
physical_parameters:
  # 温度変化データの固定磁場 (Tesla)
  B_fixed: 9.0
  # 磁場変化データの固定温度 (Kelvin) - load_unified_data関数内で使用
  T_fixed: 4.0
  # 膜厚 (meter) - 固定値として使用
  d_fixed: 157.8e-6
  # スピン量子数
  s: 3.5
  # スピン密度 (m^-3)
  N_spin: 1.9386e+28 # 24 / 1.238 * 1e27

  # --- パラメータの初期値 ---
  # 【THz単位系】数値計算安定性のため、周波数・緩和率はTHz単位で統一
  # 【修正】指導教員の指導に基づき、文献値を初期値に設定
  initial_values:
    eps_bg: 14.20
    g_factor: 2.00          # g因子はアンカーとして固定（ものさし）
    B4: 0.0                 # 結晶場はデータから再推定（初期値は0中心）
    B6: 0.0                 # 結晶場はデータから再推定（初期値は0中心）
    gamma: 0.11            # 減衰定数γの初期値 [THz]
    a_scale: 0.70           # スケーリング係数の初期値（無次元）

# --- 解析条件設定 ---
analysis_settings:
  # 温度・磁場データの自動検出設定
  # - 温度列: 列名が'K'で終わる列を自動検出(例: '4K', '10K', '30K', '100K', '300K', ...)
  # - 磁場列: 列名が'T'で終わる列を自動検出(例: '1T', '2T', '3T', ...)
  # ※温度列と磁場列の両方が自動検出され、温度列を除外した上で磁場列が判定される
  # ※Excelファイルにこれらの列がない場合は処理されない
  
  # 周波数領域のカットオフ値 (THz)
  low_freq_cutoff: 0.361505   # 低周波カットオフ（現在未使用）
  high_freq_cutoff: 0.45       # 高周波カットオフ（eps_bgフィッティング用）
  
  # --- 重み付け設定 ---
  weight_settings:
    # ピーク検出の閾値設定
    peak_height_threshold: 0.01      # ピーク検出の最小高さ（正規化透過率）
    peak_prominence_threshold: 0.04  # ピーク検出のプロミネンス閾値
    peak_distance: 10                # ピーク間の最小距離（データ点数）
    
    # 重み値設定  
    lp_up_peak_weight: 1.0          # LP・UPピーク領域の重み
    between_peaks_weight: 0.4       # LP-UP間の重み
    high_freq_peak_weight: 1.0      # 高周波ピークの重み
    background_weight: 0.01         # その他の領域の重み（バックグラウンド）

# --- ベイズ推定事前分布設定 ---
bayesian_priors:
  # 【戦略】
  # - g因子は手作業フィットの知見 (1.9 <= g <= 2.1) を反映して狭い範囲に制約
  # - 結晶場パラメータ B4, B6 は低周波の吸収強度・形状を支配するため広く探索
  # - a_scale（全体強度）は結晶場と競合しすぎない程度に拘束（正値制約）

  magnetic_parameters:
    g_factor:
      distribution: "TruncatedNormal"
      mu: 2.00
      sigma: 0.01
      lower: 1.90
      upper: 2.10

    B4:
      distribution: "TruncatedNormal"
      mu: 0.0
      sigma: 0.005
      lower: -0.02
      upper: 0.02

    B6:
      distribution: "TruncatedNormal"
      mu: 0.0
      sigma: 0.00005
      lower: -0.0002
      upper: 0.0002

    a_scale:
      distribution: "TruncatedNormal"
      mu: 1.0
      sigma: 0.2
      lower: 0.5
      upper: 2.5

  # 事前情報がある場合（2回目以降）
  # B4/B6/a_scale は前回推定値を中心（muはコード側で上書き）にして探索を継続
  with_prior_info:
    a_scale:
      distribution: "TruncatedNormal"
      sigma: 0.15
      lower: 0.5
      upper: 2.5

    g_factor:
      distribution: "TruncatedNormal"
      mu: 2.00
      sigma: 0.01
      lower: 1.90
      upper: 2.10

    B4:
      distribution: "TruncatedNormal"
      sigma: 0.005
      lower: -0.02
      upper: 0.02

    B6:
      distribution: "TruncatedNormal"
      sigma: 0.00005
      lower: -0.0002
      upper: 0.0002

  gamma_parameters:
    log_gamma_mu_base:
      distribution: "Normal"
      sigma: 1.0

    log_gamma_sigma_base:
      distribution: "HalfNormal"
      sigma: 0.5

    log_gamma_offset_base:
      distribution: "Normal"
      mu: 0.0
      sigma: 0.5
      shape: 7

    temp_gamma_slope:
      distribution: "Normal"
      mu: 0.003
      sigma: 0.15

  noise_parameters:
    sigma:
      distribution: "HalfNormal"
      sigma: 0.05

  # B_formも同一戦略（g制約 + 結晶場探索 + a_scale拘束）
  b_form_magnetic_parameters:
    g_factor:
      distribution: "TruncatedNormal"
      mu: 2.00
      sigma: 0.01
      lower: 1.90
      upper: 2.10

    B4:
      distribution: "TruncatedNormal"
      mu: 0.0
      sigma: 0.005
      lower: -0.02
      upper: 0.02

    B6:
      distribution: "TruncatedNormal"
      mu: 0.0
      sigma: 0.00005
      lower: -0.0002
      upper: 0.0002

    a_scale:
      distribution: "TruncatedNormal"
      mu: 1.0
      sigma: 0.2
      lower: 0.5
      upper: 2.5
  b_form_with_prior_info:
    a_scale:
      distribution: "TruncatedNormal"
      sigma: 0.15
      lower: 0.5
      upper: 2.5

    g_factor:
      distribution: "TruncatedNormal"
      mu: 2.00
      sigma: 0.01
      lower: 1.90
      upper: 2.10

    B4:
      distribution: "TruncatedNormal"
      sigma: 0.005
      lower: -0.02
      upper: 0.02

    B6:
      distribution: "TruncatedNormal"
      sigma: 0.00005
      lower: -0.0002
      upper: 0.0002
  
  # B_form専用の事前情報がある場合の設定（2回目以降）
  b_form_with_prior_info:
    a_scale:
      distribution: "TruncatedNormal"
      sigma: 0.15
      lower: 0.0
      upper: 2.0
    
    g_factor:
      mu: 2.00
      distribution: "Normal"
      sigma: 0.002
    
    B4:
      distribution: "TruncatedNormal"
      sigma: 0.005
      lower: -0.02
      upper: 0.02
    
    B6:
      distribution: "TruncatedNormal"
      sigma: 0.00005
      lower: -0.0002
      upper: 0.0002
  
  # B_form専用のgammaパラメータ
  b_form_gamma_parameters:
    log_gamma_mu_base:
      distribution: "Normal"
      sigma: 0.8
    
    log_gamma_sigma_base:
      distribution: "HalfNormal"
      sigma: 0.4
    
    log_gamma_offset_base:
      distribution: "Normal"
      mu: 0.0
      sigma: 0.4
      shape: 7
    
    temp_gamma_slope:
      distribution: "Normal"
      mu: 0.003           # H_formと統一
      sigma: 0.15         # 【修正】0.03 → 0.15（広い温度範囲対応）

# --- MCMCサンプリング設定 ---
mcmc:
  # サンプリング数（チェーンごと）
  draws: 2000    # 収束改善のため増加
  # チューニング（warmup）期間
  tune: 1000     # 多峰性対策のため増加
  # 並列チェーン数
  chains: 8
  # 並列実行コア数（chains数と同じに設定）
  cores: 8
  # 受理率の目標値（高いほど慎重にサンプリング）
  target_accept: 0.9  # 発散防止のため高めに設定
  
  # B_form専用の強化設定（収束困難なモデル用）
  b_form_overrides:
    draws: 2000         # H_formの2倍（より多くのサンプル）
    tune: 1000          # 長いチューニング期間
    target_accept: 0.9 # より慎重なサンプリング
    max_iterations: 3   # 追加の反復でeps_bg更新
  # パラメータ更新の反復回数
  # 各反復でeps_bgを更新してベイズ推定を再実行
  max_iterations: 2
  # 初期化戦略
  init: "adapt_diag"
  # 再現性確保のための乱数シード
  random_seed: 42

# --- データセット設定（統合処理用） ---
dataset_config:
  # 温度変化データの説明
  temp_variable:
    enabled: true
    description: "温度を変数、磁場を固定したデータセット"
    # B_fixedと自動検出された温度列('K'で終わる列)から自動生成
  
  # 磁場変化データの説明
  field_variable:
    enabled: true
    description: "磁場を変数、温度を固定したデータセット"
    # T_fixedと自動検出された磁場列('T'で終わる列)から生成

# --- 出力設定 ---
output:
  # 保存するファイル
  save_trace: true              # traceファイル（.nc）を保存
  save_parameters: true         # パラメータCSVを保存
  save_bt_params: true          # (B,T)別光学パラメータCSVを保存